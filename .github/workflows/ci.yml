name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Logic tests
        run: Tests/logic/run.sh

      # Breaks the shared sources on purpose, one way at a time; the logic tests have to notice every one.
      - name: Mutation check
        run: Tests/mutations.sh

      - name: Build swda
        run: FAIL_ON_WARNINGS=1 Tests/build-scratch.sh cli "$RUNNER_TEMP/cli"

      - name: Build the app
        run: FAIL_ON_WARNINGS=1 Tests/build-scratch.sh app "$RUNNER_TEMP/app"

      - name: Build Do Nothing
        run: FAIL_ON_WARNINGS=1 Tests/build-scratch.sh dummy "$RUNNER_TEMP/dummy"

      # What the programs link to, not what the sources say: no deprecated or private Launch Services function, no networking.
      - name: Check the built programs
        run: |
          Tests/check-artifacts.sh \
            "$RUNNER_TEMP/cli/products/Release/swda" \
            "$RUNNER_TEMP/app/products/Release/SwiftDefaultApps.app" \
            "$RUNNER_TEMP/dummy/products/Release/ThisAppDoesNothing.app"

      # Output that is the same on every Mac, compared with the recordings in Tests/contract.
      - name: Command-line contract
        run: Tests/contract.sh "$RUNNER_TEMP/cli/products/Release/swda"

      - name: Without the per-role functions
        run: Tests/legacy-roles-off.sh "$RUNNER_TEMP/cli/products/Release/swda"

      - name: Keep the logs when a build fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs
          path: ${{ runner.temp }}/*/build.log
          if-no-files-found: ignore
